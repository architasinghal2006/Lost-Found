{% extends "base.html" %}
{% import "_ui.html" as ui %}
{% block content %}
<div class="auth">
  <img src="/static/icons/icon-192.png" alt="" width="64" height="64" class="auth-logo">
  <h1>Welcome back</h1>
  <p class="muted">Log in to claim items and report what you've found.</p>
  <form method="post" action="/login" class="card">
    {% if error %}<div class="error-box">{{ ui.icon("triangle-alert") }}<p class="error">{{ error }}</p></div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username <input name="username" autocomplete="username" required></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button class="wide">Log in</button>
    <p class="muted center">No account? <a href="/register">Register</a></p>
  </form>
</div>
{% endblock %}
